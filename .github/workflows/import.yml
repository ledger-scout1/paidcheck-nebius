name: Import Nebius files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source and commit files
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/ledger-scout1/paidcheck-nebius/main/nebius_push_paidcheck.zip" -o /tmp/paidcheck.zip
          ls -l /tmp/paidcheck.zip
          unzip -o /tmp/paidcheck.zip -d .
          rm -f nebius_push_paidcheck.zip
          ls -l requirements.txt Dockerfile .env.example
          wc -c requirements.txt Dockerfile .env.example
          test "$(wc -c < requirements.txt)" -eq 191
          test "$(wc -c < Dockerfile)" -eq 104
          test "$(wc -c < .env.example)" -eq 244
          if head -n 1 app.py | grep -q DOCTYPE; then echo "HTML detected in app.py"; exit 1; fi
          if head -n 1 .env.example | grep -q DOCTYPE; then echo "HTML detected in .env.example"; exit 1; fi
          find . -type f -not -path './.git/*' -not -path './.github/*' | sort
          test "$(find . -type f -not -path './.git/*' -not -path './.github/*' | wc -l)" -eq 26
          git config user.name "ledger-scout1"
          git config user.email "ledger-scout1@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Nebius edition: Nemotron understanding/explanation layer + Tavily public context, verdict boundary tested (59 tests)"
          git push
